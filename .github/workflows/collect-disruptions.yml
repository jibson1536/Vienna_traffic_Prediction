name: Collect Wiener Linien disruptions

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch:         # lets you start a run by hand from the Actions tab

permissions:
  contents: write            # needed to commit the updated data file

concurrency:
  group: collect-disruptions
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect disruptions
        run: python collector/collect_disruptions.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/disruption_events.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: disruption update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
